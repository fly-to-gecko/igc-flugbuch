// ---------- Flugplätze ----------
function showAirfields() {
  const listEl = el('div', { class: 'af-list' });
  const countEl = el('span', { class: 'count' });
  const q = el('input', { type: 'search', placeholder: 'Name, Kürzel oder Land …', 'aria-label': 'Flugplätze suchen' });
  const draw = () => {
    const terms = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    const all = state.airfields.slice().sort((a, b) => a.name.localeCompare(b.name, 'de'));
    const hits = terms.length ? all.filter(a => { const s = `${a.name} ${a.code} ${a.country}`.toLowerCase(); return terms.every(t => s.includes(t)); }) : all;
    countEl.textContent = `${hits.length} von ${state.airfields.length} Flugplätzen` + (hits.length > 300 ? ' (erste 300 angezeigt)' : '');
    const frag = document.createDocumentFragment();
    for (const a of hits.slice(0, 300)) {
      frag.append(el('div', { class: 'af-row' },
        el('div', { class: 'n' }, el('b', { text: a.name }), el('span', { text: `${C.fmtCoord(a.lat, a.lon)}${a.elev != null ? ' · ' + a.elev + ' m' : ''}${a.code ? ' · ' + a.code : ''}${a.country ? ' · ' + a.country : ''}` })),
        el('span', { class: 'tag', text: a.source || 'cup' }),
        iconBtn('trash', 'Flugplatz löschen', 'i-del', async () => {
          if (!await confirmDialog(`Flugplatz „${a.name}“ löschen?`)) return;
          state.airfields = state.airfields.filter(x => x !== a);
          await afChanged(); draw();
        })));
    }
    if (!hits.length) frag.append(el('div', { class: 'empty', style: 'padding:24px', text: state.airfields.length ? 'Keine Treffer.' : 'Noch keine Flugplätze gespeichert.' }));
    listEl.replaceChildren(frag);
  };
  q.addEventListener('input', draw);

  const nName = el('input', { type: 'text', placeholder: 'z. B. Musterstadt' });
  const nCoord = el('input', { type: 'text', placeholder: '51.1305, 9.8167  oder  5107.830N 00949.000E' });
  const nElev = el('input', { type: 'text', placeholder: 'optional, m', style: 'max-width:120px' });
  const addBtn = el('button', { type: 'button', class: 'btn primary', html: icon('plus', 16) + '<span>Hinzufügen</span>', onclick: async () => {
    const name = nName.value.trim(), c = C.parseCoordInput(nCoord.value);
    if (!name) return toast('Bitte einen Namen eingeben.', 'warn');
    if (!c) return toast('Koordinaten nicht erkannt. Format: 51.1305, 9.8167 oder 5107.830N 00949.000E', 'warn');
    state.airfields.push({ id: uid(), name, code: '', country: '', lat: c.lat, lon: c.lon, elev: C.parseElev(nElev.value), source: 'manuell' });
    nName.value = nCoord.value = nElev.value = '';
    await afChanged(); draw(); toast(`„${name}“ hinzugefügt.`, 'ok');
  } });

  const cupInput = el('input', { type: 'file', accept: '.cup,.CUP,.csv', hidden: true });
  const withOutl = el('input', { type: 'checkbox' });
  const allWp = el('input', { type: 'checkbox' });
  cupInput.addEventListener('change', async () => {
    const file = cupInput.files[0]; cupInput.value = '';
    if (!file) return;
    try {
      const text = C.decodeBytes(await readFile(file));
      const styles = allWp.checked ? null : (withOutl.checked ? [2, 3, 4, 5] : [2, 4, 5]);
      const r = C.parseCUP(text, styles);
      let added = 0, dupl = 0;
      for (const it of r.items) {
        const exists = state.airfields.some(a => a.name.toLowerCase() === it.name.toLowerCase() && C.haversine(a.lat, a.lon, it.lat, it.lon) < 1000);
        if (exists) { dupl++; continue; }
        state.airfields.push(Object.assign({ id: uid(), source: 'cup' }, it)); added++;
      }
      await afChanged(); draw();
      toast(`${file.name}: ${added} Flugplätze importiert` + (dupl ? `, ${dupl} bereits vorhanden` : '') + (r.filtered ? `, ${r.filtered} Wegpunkte (keine Flugplätze) ausgelassen` : '') + (r.invalid ? `, ${r.invalid} Zeilen ungültig` : ''), added ? 'ok' : 'warn', 7000);
    } catch (e) { toast('CUP-Import fehlgeschlagen: ' + e.message, 'error'); }
  });

  const lookupBtn = el('button', { type: 'button', class: 'btn', html: icon('globe', 16) + '<span>Unbekannte Orte über openAIP suchen</span>', onclick: async () => {
    lookupBtn.disabled = true;
    try { await lookupOpenAip(); draw(); } finally { lookupBtn.disabled = false; }
  } });

  const body = el('div', null,
    el('p', { class: 'hint', text: `Start- und Landeorte werden mit dieser Liste abgeglichen (Radius ${C.CFG.matchRadiusKm} km). Unbekannte Orte können auch direkt in der Tabelle benannt werden.` }),
    el('div', { class: 'section', style: 'border-top:none;margin-top:0;padding-top:0' }, el('h3', { text: 'Import' }),
      el('div', { class: 'row', style: 'align-items:center' },
        el('button', { type: 'button', class: 'btn', html: icon('upload', 16) + '<span>SeeYou-.cup-Datei importieren</span>', onclick: () => cupInput.click() }), cupInput, lookupBtn),
      el('label', { class: 'check' }, withOutl, 'Außenlandefelder (Style 3) mit importieren'),
      el('label', { class: 'check' }, allWp, 'Alle Wegpunkte importieren (auch Wendepunkte ohne Flugplatz-Style)')),
    el('div', { class: 'section' }, el('h3', { text: 'Manuell hinzufügen' }),
      el('div', { class: 'row' },
        el('div', { class: 'field' }, el('label', { text: 'Name' }), nName),
        el('div', { class: 'field', style: 'flex:2' }, el('label', { text: 'Koordinaten' }), nCoord),
        el('div', { class: 'field', style: 'flex:0' }, el('label', { text: 'Höhe' }), nElev),
        el('div', { class: 'field', style: 'flex:0' }, addBtn))),
    el('div', { class: 'section' }, el('h3', { text: 'Gespeicherte Flugplätze' }),
      el('div', { class: 'row', style: 'align-items:center;margin-bottom:10px' }, el('div', { class: 'field', style: 'margin:0;max-width:340px' }, q), countEl),
      listEl));
  openModal({ title: 'Flugplatz-Datenbank', size: 'lg', body });
  draw();
}

async function afChanged() {
  await saveAirfields();
  rematchAll();
  await saveFlights();
  render();
}

async function lookupOpenAip() {
  const key = (state.settings.apiKey || '').trim();
  if (!key) { toast('Bitte zuerst den openAIP-API-Key in den Einstellungen eintragen.', 'warn'); return; }
  const pts = [];
  for (const f of state.flights) {
    if (!f.startAf && !f.startOverride) pts.push([f.startLat, f.startLon]);
    if (!f.landAf && !f.landOverride) pts.push([f.landLat, f.landLon]);
  }
  const queries = [];
  for (const p of pts) if (!queries.some(q => C.haversine(q[0], q[1], p[0], p[1]) < C.CFG.matchRadiusKm * 1000)) queries.push(p);
  if (!queries.length) { toast('Keine unbekannten Start- oder Landeorte vorhanden.', 'info'); return; }
  let added = 0, failed = 0, none = 0;
  for (const [lat, lon] of queries.slice(0, 40)) {
    try {
      const url = `https://api.core.openaip.net/api/airports?pos=${lat.toFixed(5)},${lon.toFixed(5)}&dist=${C.CFG.matchRadiusKm * 1000}&limit=5&apiKey=${encodeURIComponent(key)}`;
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      const items = (j.items || []).filter(it => it.geometry && Array.isArray(it.geometry.coordinates));
      if (!items.length) { none++; continue; }
      items.sort((a, b) => C.haversine(lat, lon, a.geometry.coordinates[1], a.geometry.coordinates[0]) - C.haversine(lat, lon, b.geometry.coordinates[1], b.geometry.coordinates[0]));
      const it = items[0];
      const alat = it.geometry.coordinates[1], alon = it.geometry.coordinates[0];
      if (state.airfields.some(a => C.haversine(a.lat, a.lon, alat, alon) < 500)) continue;
      state.airfields.push({ id: uid(), name: it.name || 'openAIP', code: it.icaoCode || '', country: it.country || '', lat: alat, lon: alon,
        elev: it.elevation && it.elevation.value != null ? Math.round(it.elevation.value) : null, source: 'openAIP' });
      added++;
    } catch (e) { failed++; }
  }
  if (added) await afChanged();
  toast(`openAIP-Suche: ${added} Flugplätze ergänzt` + (none ? `, ${none} Orte ohne Treffer` : '') + (failed ? `, ${failed} Anfragen fehlgeschlagen (API-Key/Netz prüfen)` : ''), failed && !added ? 'error' : (added ? 'ok' : 'warn'), 7000);
}

function showBackup() {
  const inp = el('input', { type: 'file', accept: '.json,application/json', hidden: true });
  inp.addEventListener('change', async () => {
    const file = inp.files[0]; inp.value = '';
    if (!file) return;
    try {
      const data = JSON.parse(C.decodeBytes(await readFile(file)));
      if (!data || data.app !== 'igc-flugbuch' || !Array.isArray(data.flights)) throw new Error('keine Flugbuch-Sicherung');
      const known = new Set(state.flights.map(f => f.hash));
      let fa = 0, aa = 0;
      for (const f of data.flights) {
        if (!f || !f.hash || known.has(f.hash)) continue;
        const tr = data.tracks && data.tracks[f.id];
        if (tr) await Store.set(trackKey(f.id), JSON.stringify(tr));
        state.flights.push(f); known.add(f.hash); fa++;
      }
      for (const a of data.airfields || []) {
        if (!a || !isFinite(a.lat) || !isFinite(a.lon) || !a.name) continue;
        if (state.airfields.some(x => x.name.toLowerCase() === a.name.toLowerCase() && C.haversine(x.lat, x.lon, a.lat, a.lon) < 1000)) continue;
        state.airfields.push(Object.assign({ id: uid() }, a)); aa++;
      }
      if (!state.settings.apiKey && data.settings && data.settings.apiKey) { state.settings.apiKey = data.settings.apiKey; await saveSettings(); }
      await saveAirfields(); rematchAll(); await saveFlights(); render();
      toast(`Sicherung eingelesen: ${fa} Flüge, ${aa} Flugplätze ergänzt.`, 'ok');
      m.close();
    } catch (e) { toast('Sicherung konnte nicht gelesen werden: ' + e.message, 'error'); }
  });
  const exp = async () => {
    const tracks = {};
    for (const f of state.flights) { const tr = await loadJSON(trackKey(f.id), null); if (tr) tracks[f.id] = tr; }
    const data = { app: 'igc-flugbuch', version: 1, exportedAt: new Date().toISOString(), flights: state.flights, airfields: state.airfields, tracks, settings: { apiKey: state.settings.apiKey || '' } };
    download(`flugbuch_sicherung_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data), 'application/json');
  };
  const m = openModal({
    title: 'Sicherung', body: el('div', null,
      el('p', { class: 'hint', text: 'Das Flugbuch liegt im Speicher dieses Browsers. Mit einer Sicherung (JSON) lassen sich Flüge, Tracks und Flugplätze auf ein anderes Gerät übertragen oder wiederherstellen. Beim Einlesen werden vorhandene Flüge nicht doppelt angelegt.' }),
      el('div', { class: 'row' },
        el('button', { type: 'button', class: 'btn primary', html: icon('download', 16) + '<span>Sicherung herunterladen</span>', onclick: exp }),
        el('button', { type: 'button', class: 'btn', html: icon('restore', 16) + '<span>Sicherung einlesen</span>', onclick: () => inp.click() }), inp))
  });
}

// ---------- Luftraumprüfung ----------
// Luftraumdaten (OpenAir) werden als "Datensätze" mit Gültigkeitsdatum gespeichert. Für einen Flug zählen alle Datensätze
// aus dem jüngsten Jahrgang, der vor dem Flugdatum gültig war (z. B. Deutschland 2021 + Österreich 2021).
const AS_LABELS = { verletzung: 'Verletzung', pruefen: 'prüfen', info: 'Hinweis', sektor: 'Segelflugsektor' };
const AS_COLORS = { verletzung: '#d62828', pruefen: '#e08a00', info: '#1f7fc4', sektor: '#2a9d5c' };

function asSummary(f) {
  const r = f.asResult;
  if (!r) return { cls: 'as-none', text: 'nicht geprüft', rank: 0, csv: 'nicht geprüft', search: '',
    tip: state.airspaces.length ? 'Noch nicht geprüft – unter „Lufträume“ alle Flüge prüfen' : 'Keine Luftraumdaten – unter „Lufträume“ eine OpenAir-Datei einlesen' };
  const n = r.counts, parts = [];
  if (n.verletzung) parts.push(`${n.verletzung} Verletzung${n.verletzung > 1 ? 'en' : ''}`);
  if (n.pruefen) parts.push(`${n.pruefen} prüfen`);
  if (n.sektor) parts.push(`${n.sektor} Segelflugsektor`);
  if (n.info) parts.push(`${n.info} Hinweis${n.info > 1 ? 'e' : ''} (TMZ/RMZ/ED-D)`);
  const tip = (parts.join('\n') || 'Keine Einflüge in kontrollierte oder gesperrte Lufträume') + '\nKlicken für Details';
  if (n.verletzung) return { cls: 'as-bad', text: parts[0], rank: 3, csv: parts.join(', '), search: 'luftraumverletzung', tip };
  if (n.pruefen) return { cls: 'as-check', text: `${n.pruefen} prüfen`, rank: 2, csv: parts.join(', '), search: 'luftraum prüfen', tip };
  return { cls: 'as-ok', text: 'keine Verletzung', rank: 1, csv: parts.length ? parts.join(', ') : 'keine', search: 'luftraum ok', tip };
}
function asBadge(f) {
  const s = asSummary(f);
  return el('button', { type: 'button', class: 'as-badge ' + s.cls, 'data-tip': s.tip, 'data-fid': f.id, 'data-field': 'as',
    onclick: () => (f.asResult ? showAsFindings(f) : showAirspaces()) }, s.text);
}

const Airspace = (() => {
  let byRef = null;
  function index() {
    if (!byRef) {
      byRef = new Map();
      for (const set of state.airspaces) set.items.forEach((a, i) => { a.ref = set.id + ':' + i; byRef.set(a.ref, a); });
    }
    return byRef;
  }
  const year = s => (s.validFrom || '0000').slice(0, 4);
  function setsFor(date) {
    const sets = state.airspaces;
    if (!sets.length) return { sets: [], note: '' };
    const older = sets.filter(s => (s.validFrom || '') <= (date || '9999'));
    if (older.length) { const y = older.map(year).sort().pop(); return { sets: older.filter(s => year(s) === y), note: '' }; }
    const y = sets.map(year).sort()[0];
    return { sets: sets.filter(s => year(s) === y), note: 'Die Luftraumdaten sind jünger als der Flug – damals können andere Grenzen gegolten haben.' };
  }
  async function trackFor(f) {
    const tr = await loadJSON(trackKey(f.id), null);
    if (tr && tr.t && tr.t.length) return tr;
    return f.srcPath ? Folder.rebuildTrack(f) : null;
  }
  async function checkFlight(f) {
    const { sets, note } = setsFor(f.date);
    if (!sets.length) return false;
    const tr = await trackFor(f);
    if (!tr) return false;
    index();
    const findings = C.checkAirspaces(tr, f, sets.flatMap(s => s.items));
    const counts = { verletzung: 0, pruefen: 0, info: 0, sektor: 0 };
    for (const x of findings) counts[x.kind]++;
    f.asResult = { checkedAt: new Date().toISOString(), sets: sets.map(s => `${s.name} (gültig ab ${C.fmtDateDE(s.validFrom) || '?'})`), note, counts, findings, noPalt: !tr.palt };
    return true;
  }
  async function checkFlights(list, opts = {}) {
    if (!state.airspaces.length) { toast('Keine Luftraumdaten vorhanden. Bitte zuerst eine OpenAir-Datei einlesen.', 'warn'); return; }
    const prog = $('progress');
    let failed = 0;
    for (let i = 0; i < list.length; i++) {
      prog.textContent = `Prüfe Lufträume ${i + 1} / ${list.length} …`;
      try { if (!await checkFlight(list[i])) failed++; } catch (e) { failed++; console.warn(e); }
      if (i % 10 === 9) await new Promise(r => setTimeout(r, 0));
    }
    prog.textContent = '';
    await saveFlights(); render();
    const bad = list.filter(f => f.asResult && f.asResult.counts.verletzung).length;
    const chk = list.filter(f => f.asResult && !f.asResult.counts.verletzung && f.asResult.counts.pruefen).length;
    if (!opts.quiet || bad || chk)
      toast(`Luftraumprüfung (${list.length} ${list.length === 1 ? 'Flug' : 'Flüge'}): ${bad} mit Verletzung, ${chk} zum Prüfen` + (failed ? `, ${failed} ohne Trackdaten` : ''), bad ? 'warn' : 'ok', 7000);
  }
  async function changed() {
    byRef = null;
    if (!await Store.set(K_AIRSPACES, JSON.stringify(state.airspaces))) toast('Luftraumdaten konnten nicht gespeichert werden (Speicher voll?).', 'error');
    Folder.scheduleAirspaceWrite();
  }
  return { index, setsFor, checkFlight, checkFlights, changed };
})();

  const m = openModal({ title: 'Luftraumprüfung', sub: `${C.fmtDateDE(f.date)} · ${planeText(f)} · alle Zeiten UTC`, size: 'lg', body,
    foot: [
      el('button', { type: 'button', class: 'btn', html: icon('refresh', 16) + '<span>Neu prüfen</span>', onclick: async () => { m.close(); await Airspace.checkFlights([f]); showAsFindings(f); } }),
      el('button', { type: 'button', class: 'btn primary', html: icon('route', 16) + '<span>Auf Karte zeigen</span>', onclick: () => { m.close(); showTrack(f, { airspace: true, withInfo: true }); } })] });

function showAirspaces() {
  const body = el('div');
  const fileInp = el('input', { type: 'file', accept: '.txt,.air,.openair,.TXT', multiple: true, hidden: true });
  fileInp.addEventListener('change', async () => {
    const files = Array.from(fileInp.files); fileInp.value = '';
    let added = 0;
    for (const file of files) {
      try {
        const text = C.decodeBytes(await readFile(file));
        const r = C.parseOpenAir(text);
        if (!r.items.length) { toast(`${file.name}: keine Lufträume im OpenAir-Format gefunden.`, 'error'); continue; }
        const validFrom = C.guessValidFrom(text, file.name);
        state.airspaces.push({ id: uid(), name: file.name.replace(/\.[^.]+$/, ''), validFrom, importedAt: new Date().toISOString(), items: r.items });
        added++;
        toast(`${file.name}: ${r.items.length} Lufträume eingelesen` + (validFrom ? `, gültig ab ${C.fmtDateDE(validFrom)}` : ' – bitte „gültig ab“ eintragen') + (r.skipped ? ` (${r.skipped} unvollständige übersprungen)` : ''), 'ok', 6000);
      } catch (e) { toast(`${file.name}: ${e.message}`, 'error'); }
    }
    if (added) { await Airspace.changed(); draw(); await Airspace.checkFlights(state.flights); draw(); }
  });
  const draw = () => {
    const sets = state.airspaces.slice().sort((a, b) => (a.validFrom || '').localeCompare(b.validFrom || '') || a.name.localeCompare(b.name));
    const checked = state.flights.filter(f => f.asResult).length;
    const list = sets.length ? el('div', { class: 'af-list' }, sets.map(set => {
      const date = el('input', { type: 'date', value: set.validFrom || '', 'aria-label': 'gültig ab', style: 'padding:4px 6px;border-radius:6px;border:1px solid var(--line2);background:var(--bg);color-scheme:dark' });
      date.addEventListener('change', async () => { set.validFrom = date.value; await Airspace.changed(); toast('Gültigkeit geändert – zum Übernehmen „Alle Flüge prüfen“.', 'info'); });
      const counts = {};
      for (const a of set.items) counts[a.cls] = (counts[a.cls] || 0) + 1;
      const summary = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 7).map(([k, v]) => `${v} ${k}`).join(' · ');
      return el('div', { class: 'af-row' },
        el('div', { class: 'n' }, el('b', { text: set.name }), el('span', { text: `${set.items.length} Lufträume: ${summary}` })),
        el('label', { style: 'font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px' }, 'gültig ab', date),
        iconBtn('trash', 'Datensatz löschen', 'i-del', async () => {
          if (!await confirmDialog(`Luftraumdaten „${set.name}“ löschen?`)) return;
          state.airspaces = state.airspaces.filter(x => x !== set);
          await Airspace.changed(); draw();
        }));
    })) : el('div', { class: 'empty', style: 'padding:24px', text: 'Noch keine Luftraumdaten eingelesen.' });
    body.replaceChildren(
      el('p', { class: 'hint', text: 'Die App prüft jede Flugspur gegen Luftraumdaten im OpenAir-Format (.txt, wie für SeeYou, XCSoar oder LXNAV). Die Dateien werden nur im Browser gelesen. Für Flüge aus verschiedenen Jahren kannst du mehrere Datensätze mit „gültig ab“-Datum einlesen. Für jeden Flug zählt der jüngste Jahrgang, der zum Flugdatum schon galt; mehrere Länder desselben Jahrgangs werden zusammen verwendet.' }),
      el('div', { class: 'row', style: 'margin-bottom:12px' },
        el('button', { type: 'button', class: 'btn primary', html: icon('upload', 16) + '<span>OpenAir-Datei(en) einlesen</span>', onclick: () => fileInp.click() }), fileInp,
        state.airspaces.length ? el('button', { type: 'button', class: 'btn', html: icon('refresh', 16) + '<span>Alle Flüge prüfen</span>', onclick: async () => { await Airspace.checkFlights(state.flights); draw(); } }) : null),
      list,
      el('p', { class: 'hint', style: 'margin-top:12px', text: `${checked} von ${state.flights.length} Flügen geprüft. Bewertet werden Luftraum C, D, CTR und Sperrgebiete als „Verletzung“, Flugbeschränkungsgebiete (ED-R) als „prüfen“, TMZ, RMZ und Gefahrengebiete (ED-D) als Hinweis. Flüge in Segelflugsektoren werden gesondert ausgewiesen.` }),
      el('p', { class: 'disclaimer', text: 'Ohne Gewähr: Freigaben, Aktivierungszeiten und NOTAMs kennt die App nicht. Ergebnisse sind Hinweise zum Nachprüfen, keine Feststellung.' }));
  };
  openModal({ title: 'Lufträume', size: 'lg', body });
  draw();
}

// ---------- Lokaler Flugbuch-Ordner (File System Access API: Chrome, Edge, Brave, Opera) ----------
// Die IGC-Dateien bleiben in einem Ordner auf dem Rechner. Die App merkt sich den Ordner, liest beim Start neue
// Dateien automatisch ein und schreibt ihre Daten (ohne Tracks) zusätzlich als kleine flugbuch.json in den Ordner.
const DATA_FILE = 'flugbuch.json', AS_FILE = 'luftraeume.json';
const Folder = (() => {
  const supported = typeof window.showDirectoryPicker === 'function';
  let asTimer = null;
  let handle = null, perm = 'none', lastSync = 0, syncing = false, writeTimer = null, writeErrShown = false, loading = false, persistAsked = false;
  const errorKeys = new Set();

  // Der Ordner-Handle lässt sich nur in IndexedDB ablegen (nicht als Text), daher eine eigene kleine Datenbank.
  const hdb = () => new Promise((res, rej) => {
    const r = indexedDB.open('igc-flugbuch-ordner', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  async function keepHandle(h) {
    try {
      const db = await hdb();
      await new Promise((res, rej) => {
        const tx = db.transaction('h', 'readwrite'), s = tx.objectStore('h');
        if (h) s.put(h, 'dir'); else s.delete('dir');
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
      db.close();
    } catch (e) { console.warn('Ordner-Verknüpfung nicht gespeichert', e); }
  }
  async function storedHandle() {
    try {
      const db = await hdb();
      const h = await new Promise((res, rej) => { const r = db.transaction('h').objectStore('h').get('dir'); r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error); });
      db.close();
      return h;
    } catch (e) { return null; }
  }

  const ready = () => !!handle && perm === 'granted';
  const name = () => (handle ? handle.name : '');

  async function init() {
    if (!supported) return;
    handle = await storedHandle();
    if (handle) {
      try { perm = await handle.queryPermission({ mode: 'readwrite' }); } catch (e) { perm = 'prompt'; }
    }
    updateUi();
    if (ready()) await activate();
  }
  async function activate() { await readAirspaces(); await readData(); await sync(); }

  // Luftraumdaten liegen zusätzlich als luftraeume.json im Ordner (nur eingelesen, wenn der Browser keine hat)
  async function readAirspaces() {
    if (!ready()) return;
    if (state.airspaces.length) { scheduleAirspaceWrite(); return; }
    try {
      const data = JSON.parse(await (await (await handle.getFileHandle(AS_FILE)).getFile()).text());
      if (data && data.app === 'igc-flugbuch' && Array.isArray(data.sets) && data.sets.length) {
        state.airspaces = data.sets;
        await Store.set(K_AIRSPACES, JSON.stringify(state.airspaces));
      }
    } catch (e) { /* keine Datei */ }
  }
  function scheduleAirspaceWrite() {
    if (!ready()) return;
    clearTimeout(asTimer);
    asTimer = setTimeout(async () => {
      try {
        const w = await (await handle.getFileHandle(AS_FILE, { create: true })).createWritable();
        await w.write(JSON.stringify({ app: 'igc-flugbuch', kind: 'luftraeume', version: 1, sets: state.airspaces }));
        await w.close();
      } catch (e) { toast(`${AS_FILE} konnte nicht in den Ordner geschrieben werden: ${e.message}`, 'warn'); }
    }, 800);
  }

  async function choose() {
    if (!supported) { toast('Dieser Browser unterstützt keinen Ordnerzugriff. Bitte Chrome, Edge, Brave oder Opera verwenden.', 'warn', 7000); return; }
    let h;
    try { h = await window.showDirectoryPicker({ id: 'igc-flugbuch', mode: 'readwrite' }); }
    catch (e) { if (e.name !== 'AbortError') toast('Ordner konnte nicht geöffnet werden: ' + e.message, 'error'); return; }
    handle = h; perm = 'granted'; errorKeys.clear();
    await keepHandle(h);
    updateUi();
    toast(`Flugbuch-Ordner „${h.name}“ verbunden.`, 'ok');
    await activate();
  }
  async function reconnect() {
    if (!handle) return choose();
    try { perm = await handle.requestPermission({ mode: 'readwrite' }); } catch (e) { perm = 'denied'; }
    updateUi();
    if (ready()) await activate();
    else toast('Der Zugriff auf den Ordner wurde nicht erlaubt.', 'warn');
  }
  async function disconnect() {
    handle = null; perm = 'none'; clearTimeout(writeTimer);
    await keepHandle(null);
    updateUi();
    toast('Ordner getrennt. Die Flüge bleiben im Browser gespeichert.', 'ok');
  }

  async function* walk(dir, prefix, depth) {
    for await (const [n, h] of dir.entries()) {
      if (h.kind === 'file' && /\.igc$/i.test(n)) yield { path: prefix + n, h };
      else if (h.kind === 'directory' && depth < 4 && !n.startsWith('.')) yield* walk(h, prefix + n + '/', depth + 1);
    }
  }

  // Nur Dateien lesen, deren Pfad/Größe/Änderungszeit noch unbekannt ist – das hält den Start schnell.
  async function sync() {
    if (!ready() || syncing) return;
    syncing = true; updateUi();
    try {
      const known = new Set(state.flights.map(f => f.srcKey).concat(state.ignored.map(i => i.srcKey)).filter(Boolean));
      const todo = [];
      for await (const { path, h } of walk(handle, '', 0)) {
        const file = await h.getFile();
        const key = `${path}|${file.size}|${file.lastModified}`;
        if (!known.has(key)) todo.push({ file, path, key });
      }
      if (todo.length) await importFiles(todo, { fromFolder: true });
      lastSync = Date.now();
    } catch (e) {
      if (e.name === 'NotAllowedError' || e.name === 'SecurityError') perm = 'prompt';
      toast('Der Flugbuch-Ordner konnte nicht gelesen werden: ' + e.message, 'error');
    } finally { syncing = false; updateUi(); }
  }

  // Die aktuellere Seite gewinnt (savedAt). Lokale Flüge, die in der Datei fehlen und dort nicht gelöscht wurden, bleiben erhalten.
  async function readData() {
    if (!ready()) return;
    let data = null;
    try { data = JSON.parse(await (await (await handle.getFileHandle(DATA_FILE)).getFile()).text()); }
    catch (e) { if (e.name !== 'NotFoundError') toast(`${DATA_FILE} im Ordner konnte nicht gelesen werden: ${e.message}`, 'warn'); }
    if (!data || data.app !== 'igc-flugbuch' || !Array.isArray(data.flights)) { scheduleWrite(); return; }
    const fileTime = data.savedAt || '', localTime = state.meta.savedAt || '';
    if (fileTime > localTime) {
      loading = true;
      let localOnly = [];
      try {
        const flights = data.flights.filter(f => f && f.id && f.hash);
        const ignored = Array.isArray(data.ignored) ? data.ignored : [];
        const inFile = new Set(flights.map(f => f.hash).concat(ignored.map(i => i.hash)));
        localOnly = state.flights.filter(f => !inFile.has(f.hash));
        state.flights = flights.concat(localOnly);
        state.ignored = ignored;
        if (Array.isArray(data.airfields)) state.airfields = data.airfields;
        rematchAll();
        await Store.set(K_FLIGHTS, JSON.stringify(state.flights));
        await Store.set(K_AIRFIELDS, JSON.stringify(state.airfields));
        state.meta.savedAt = localOnly.length ? new Date().toISOString() : fileTime;
        await Store.set(K_META, JSON.stringify({ savedAt: state.meta.savedAt, ignored: state.ignored }));
      } finally { loading = false; }
      render();
      if (localOnly.length) scheduleWrite();
      if (!localTime) toast(`Flugbuch aus „${handle.name}/${DATA_FILE}“ übernommen (${state.flights.length} Flüge).`, 'ok');
    } else if (fileTime < localTime) scheduleWrite();
  }

  function scheduleWrite() {
    if (!ready() || loading) return;
    clearTimeout(writeTimer);
    writeTimer = setTimeout(writeData, 800);
  }
  async function writeData() {
    if (!ready()) return;
    const data = {
      app: 'igc-flugbuch', kind: 'ordner', version: 1, savedAt: state.meta.savedAt || new Date().toISOString(),
      hinweis: 'Automatisch vom IGC-Flugbuch geschrieben. Die Tracks stehen in den IGC-Dateien dieses Ordners.',
      flights: state.flights, airfields: state.airfields, ignored: state.ignored
    };
    try {
      const w = await (await handle.getFileHandle(DATA_FILE, { create: true })).createWritable();
      await w.write(JSON.stringify(data, null, 1));
      await w.close();
      writeErrShown = false;
    } catch (e) {
      if (!writeErrShown) { writeErrShown = true; toast(`${DATA_FILE} konnte nicht in den Ordner geschrieben werden: ${e.message}`, 'error', 7000); }
    }
  }

  // Kopie einer per Drag & Drop importierten Datei im Ordner ablegen (gleichnamige, identische Datei wird nur verknüpft)
  async function storeCopy(fileName, buf) {
    if (!ready()) return null;
    try {
      const base = fileName.replace(/[\\/:*?"<>|]/g, '_');
      const dot = base.lastIndexOf('.') > 0 ? base.lastIndexOf('.') : base.length;
      const hash = C.hashText(C.decodeBytes(buf));
      for (let n = 1; n <= 50; n++) {
        const nm = n === 1 ? base : `${base.slice(0, dot)}_${n}${base.slice(dot)}`;
        let fh = null;
        try { fh = await handle.getFileHandle(nm); } catch (e) { /* frei */ }
        if (fh) {
          const ex = await fh.getFile();
          if (C.hashText(C.decodeBytes(await readFile(ex))) === hash) return { path: nm, key: `${nm}|${ex.size}|${ex.lastModified}` };
          continue;
        }
        fh = await handle.getFileHandle(nm, { create: true });
        const w = await fh.createWritable(); await w.write(buf); await w.close();
        const file = await fh.getFile();
        return { path: nm, key: `${nm}|${file.size}|${file.lastModified}` };
      }
    } catch (e) { toast('Kopie in den Flugbuch-Ordner fehlgeschlagen: ' + e.message, 'warn'); }
    return null;
  }

  // Track aus der IGC-Datei im Ordner neu berechnen (z. B. nachdem das Flugbuch aus flugbuch.json übernommen wurde)
  async function rebuildTrack(f) {
    if (!handle) return null;
    if (perm !== 'granted') {
      try { perm = await handle.requestPermission({ mode: 'readwrite' }); } catch (e) { /* abgelehnt */ }
      updateUi();
      if (perm !== 'granted') return null;
      setTimeout(activate, 0);
    }
    try {
      const parts = f.srcPath.split('/');
      let dir = handle;
      for (const p of parts.slice(0, -1)) dir = await dir.getDirectoryHandle(p);
      const file = await (await dir.getFileHandle(parts[parts.length - 1])).getFile();
      const { track } = C.analyzeIGC(C.decodeBytes(await readFile(file)));
      await Store.set(trackKey(f.id), JSON.stringify(track));
      return track;
    } catch (e) { return null; }
  }

  function firstError(key) {
    if (!key) return true;
    if (errorKeys.has(key)) return false;
    errorKeys.add(key); return true;
  }

  // Browser bitten, den Speicher nicht automatisch aufzuräumen (einmal pro Sitzung, nach dem ersten Import)
  async function askPersist() {
    if (persistAsked) return;
    persistAsked = true;
    try { if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch (e) { /* egal */ }
  }

  function updateUi() {
    const banner = $('folderBanner'), chip = $('folderChip');
    if (handle && !ready()) {
      banner.hidden = false;
      banner.replaceChildren(el('span', { html: icon('folder', 24) }),
        el('div', { class: 'txt' }, el('b', { text: `Flugbuch-Ordner „${handle.name}“` }),
          el('span', { text: 'Der Browser fragt nach einem Neustart einmal nach, ob die App den Ordner wieder lesen darf. Danach werden neue IGC-Dateien automatisch übernommen.' })),
        el('button', { type: 'button', class: 'btn primary', html: icon('refresh', 16) + '<span>Zugriff erlauben</span>', onclick: reconnect }));
    } else banner.hidden = true;
    chip.hidden = !ready();
    if (ready()) {
      chip.classList.toggle('busy', syncing);
      chip.innerHTML = icon('refresh', 14) + `<span>Ordner „${escapeHtml(handle.name)}“ · ${syncing ? 'liest …' : 'aktuell'}</span>`;
      chip.setAttribute('data-tip', 'Ordner jetzt neu einlesen');
    }
    document.dispatchEvent(new Event('folderchange'));
  }

  return { supported, init, choose, reconnect, disconnect, sync, ready, name, scheduleWrite, scheduleAirspaceWrite, storeCopy, rebuildTrack, firstError, askPersist,
    get lastSync() { return lastSync; } };
})();

function showFolder() {
  const body = el('div');
  const draw = () => {
    const linked = state.flights.filter(f => f.srcPath).length;
    const st = !Folder.supported ? ['', 'In diesem Browser nicht verfügbar', 'Ordnerzugriff gibt es in Chrome, Edge, Brave und Opera. Firefox und Safari unterstützen ihn nicht – dort bleiben die Flüge im Browser-Speicher.']
      : Folder.ready() ? ['on', `Verbunden: „${Folder.name()}“`, `${linked} von ${state.flights.length} Flügen sind mit einer IGC-Datei im Ordner verknüpft.`]
      : Folder.name() ? ['wait', `„${Folder.name()}“ – Zugriff erlauben`, 'Nach einem Neustart des Browsers muss der Zugriff einmal bestätigt werden.']
      : ['', 'Kein Ordner verbunden', 'Die Flüge liegen nur im Speicher dieses Browsers.'];
    const btn = (ic, label, cls, fn) => el('button', { type: 'button', class: 'btn ' + (cls || ''), html: icon(ic, 16) + `<span>${label}</span>`, onclick: async () => { await fn(); draw(); } });
    const copy = el('input', { type: 'checkbox', checked: state.settings.copyImports !== false, onchange: async () => { state.settings.copyImports = copy.checked; await saveSettings(); } });
    body.replaceChildren(...[
      el('p', { class: 'hint', text: 'Alles bleibt auf Ihrem Rechner: Die App liest die IGC-Dateien direkt aus einem Ordner Ihrer Wahl, hochgeladen wird nichts. Beim Öffnen der App werden neue Dateien im Ordner automatisch übernommen – bereits bekannte werden nicht erneut gelesen.' }),
      el('p', { class: 'hint', text: `Zusätzlich legt die App im Ordner eine kleine Datei „${DATA_FILE}“ mit Ihren Änderungen ab (Namen, Startarten, Flugplätze). Damit ist das Flugbuch auch nach dem Löschen des Browser-Speichers oder auf einem anderen Rechner sofort wieder da.` }),
      el('div', { class: 'status-box' }, el('span', { class: 'dot ' + st[0] }), el('div', null, el('b', { text: st[1] }), el('span', { text: st[2] }))),
      Folder.supported ? el('div', { class: 'row', style: 'margin-bottom:8px' },
        btn('folder', Folder.name() ? 'Anderen Ordner wählen …' : 'Ordner wählen …', Folder.name() ? '' : 'primary', Folder.choose),
        Folder.ready() ? btn('refresh', 'Jetzt einlesen', '', Folder.sync) : (Folder.name() ? btn('refresh', 'Zugriff erlauben', 'primary', Folder.reconnect) : null),
        Folder.name() ? btn('unlink', 'Trennen', '', Folder.disconnect) : null) : null,
      Folder.supported ? el('label', { class: 'check' }, copy, 'Per Drag & Drop importierte IGC-Dateien in den Ordner kopieren') : null,
      state.ignored.length ? el('div', { class: 'section' }, el('h3', { text: 'Gelöschte Flüge' }),
        el('p', { class: 'hint', text: `${state.ignored.length} ${state.ignored.length === 1 ? 'gelöschter Flug wird' : 'gelöschte Flüge werden'} beim Einlesen des Ordners übersprungen.` }),
        btn('restore', 'Wieder ins Flugbuch übernehmen', '', async () => { state.ignored = []; await touch(); await Folder.sync(); })) : null
    ].filter(Boolean));
  };
  document.addEventListener('folderchange', draw);
  openModal({ title: 'Flugbuch-Ordner', body, onClose: () => document.removeEventListener('folderchange', draw) });
  draw();
}

// ---------- Initialisierung ----------
function wireUi() {
  $('brandIcon').innerHTML = icon('glider', 24);
  $('dropIcon').innerHTML = icon('upload', 22);
  $('searchIcon').innerHTML = icon('search', 16);
  $('utcNote').innerHTML = icon('clock', 14) + '<span>Alle Zeiten in <b>UTC</b></span>';
  const tb = [['btnFolder', 'folder', 'Ordner'], ['btnAirfields', 'runway', 'Flugplätze'], ['btnAirspace', 'layers', 'Lufträume'], ['btnCsv', 'download', 'CSV-Export'], ['btnBackup', 'save', 'Sicherung'], ['btnSettings', 'sliders', 'Einstellungen']];
  for (const [id, ic, label] of tb) { $(id).innerHTML = icon(ic, 17) + `<span class="lbl">${label}</span>`; $(id).setAttribute('aria-label', label); $(id).setAttribute('data-tip', label); }
  $('btnFolder').onclick = showFolder;
  $('btnFolder').setAttribute('data-tip', 'Lokaler Flugbuch-Ordner');
  $('folderChip').onclick = () => (Folder.ready() ? Folder.sync() : Folder.reconnect());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Folder.ready() && Date.now() - Folder.lastSync > 15000) Folder.sync();
  });
  $('btnAirfields').onclick = showAirfields;
  $('btnAirspace').onclick = showAirspaces;
  $('btnCsv').onclick = exportCsv;
  $('btnBackup').onclick = showBackup;
  $('btnSettings').onclick = showSettings;

  const drop = $('drop'), input = $('fileInput');
  input.addEventListener('change', () => { const fl = Array.from(input.files); input.value = ''; importFiles(fl); });
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } });
  let depth = 0;
  window.addEventListener('dragenter', e => { e.preventDefault(); depth++; drop.classList.add('over'); });
  window.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) drop.classList.remove('over'); });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => {
    e.preventDefault(); depth = 0; drop.classList.remove('over');
    if (modalStack.length) return;
    if (e.dataTransfer && e.dataTransfer.files.length) importFiles(e.dataTransfer.files);
  });

  let timer = null;
  $('search').addEventListener('input', e => { clearTimeout(timer); timer = setTimeout(() => { state.search = e.target.value; render(); }, 120); });
  document.querySelectorAll('th[data-sort]').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.sort;
    if (state.sort.key === k) state.sort.dir *= -1; else state.sort = { key: k, dir: k === 'date' || k === 'dur' ? -1 : 1 };
    render();
  }));
}

async function init() {
  wireUi();
  await Store.init();
  state.flights = (await loadJSON(K_FLIGHTS, [])).filter(f => f && f.id);
  state.airfields = await loadJSON(K_AIRFIELDS, []);
  state.airspaces = await loadJSON(K_AIRSPACES, []);
  state.settings = Object.assign({ apiKey: '', copyImports: true }, await loadJSON(K_SETTINGS, {}));
  const meta = await loadJSON(K_META, {});
  state.meta.savedAt = meta.savedAt || (state.flights.length ? '0' : '');
  state.ignored = Array.isArray(meta.ignored) ? meta.ignored : [];
  render();
  if (Store.mode === 'memory') toast('Dauerhafte Speicherung ist in diesem Browser nicht verfügbar – Daten gehen beim Schließen verloren.', 'warn', 9000);
  window.Flugbuch = { importFiles, state, Folder }; // für Tests / Konsole
  await Folder.init();
}
init();
})();
</script>
